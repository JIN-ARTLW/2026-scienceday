[project]
name = "2026-scienceday"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=8.0.1",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymsis>=0.13.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sgp4>=2.27",
    "skyfield>=1.55",
    "streamlit>=1.64.0",
    "xarray>=2026.7.0",
    "xgboost>=3.0",
]

[project.optional-dependencies]
viewer = [
    "pyopengl>=3.1.7",
    "pyqtgraph>=0.13.7",
    "pyside6>=6.8",
]

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbital_decay"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
